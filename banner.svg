<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Arinchai "Nook" Charoenrak, full-stack developer</title>
  <desc id="d">A terminal window that prints: Arinchai Nook Charoenrak, full-stack developer in Rangsit, Thailand. Thoughtful interfaces. Resilient systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140d19"/>
      <stop offset="1" stop-color="#050306"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#e07ab5" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e07ab5" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="338" rx="14"/></clipPath>
    <clipPath id="c1"><rect class="type t1" x="56" y="92" width="0" height="34"/></clipPath>
    <clipPath id="c2"><rect class="type t2" x="56" y="206" width="0" height="34"/></clipPath>
    <style>
      .mono { font-family: "Fira Code", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .prompt { fill: #e07ab5; }
      .cmd { fill: #f7f0fa; }
      .name { fill: #ffffff; font-weight: 700; }
      .nick { fill: #e07ab5; }
      .sub { fill: #c5bbc9; }
      .dim { fill: #8f8395; }
      .type { animation: typing 0.9s steps(14, end) forwards; }
      .t1 { animation-delay: 0.4s; }
      .t2 { animation-delay: 2.6s; }
      .out { opacity: 0; animation: show 0.35s ease-out forwards; }
      .o1 { animation-delay: 1.5s; }
      .o2 { animation-delay: 1.75s; }
      .o3 { animation-delay: 3.7s; }
      .o4 { animation-delay: 4.3s; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .link { stroke: #e07ab5; stroke-opacity: 0.45; stroke-width: 1.5; stroke-dasharray: 5 7; animation: flow 3s linear infinite; }
      .node { fill: #050306; stroke: #e07ab5; stroke-width: 2; }
      .hub { fill: #e07ab5; }
      .pulse { fill: none; stroke: #e07ab5; stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: pulse 3s ease-out infinite; }
      .amber { stroke: #a98bd6; }
      @keyframes typing { to { width: 420px; } }
      @keyframes show { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes flow { to { stroke-dashoffset: -24; } }
      @keyframes pulse { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(3.2); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .type { animation: none; width: 420px; }
        .out { animation: none; opacity: 1; }
        .cursor, .link, .pulse { animation: none; }
        .pulse { opacity: 0; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="338" rx="14" fill="url(#bg)" stroke="#3a202f" stroke-width="2"/>
  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#glow)"/>

    <!-- title bar -->
    <rect width="1200" height="52" fill="#1a1220"/>
    <line x1="0" y1="52" x2="1200" y2="52" stroke="#3a202f" stroke-width="2"/>
    <circle cx="34" cy="26" r="7" fill="#ff5f57"/>
    <circle cx="58" cy="26" r="7" fill="#febc2e"/>
    <circle cx="82" cy="26" r="7" fill="#28c840"/>
    <text x="600" y="32" text-anchor="middle" class="mono dim" font-size="15">nook@homelab: ~</text>

    <!-- mesh network -->
    <g>
      <line class="link" x1="985" y1="190" x2="880" y2="120"/>
      <line class="link" x1="985" y1="190" x2="1095" y2="112"/>
      <line class="link" x1="985" y1="190" x2="1120" y2="232"/>
      <line class="link" x1="985" y1="190" x2="900" y2="270"/>
      <line class="link" x1="985" y1="190" x2="1010" y2="292"/>
      <line class="link amber" x1="880" y1="120" x2="1095" y2="112"/>
      <line class="link amber" x1="1120" y1="232" x2="1010" y2="292"/>
      <line class="link amber" x1="900" y1="270" x2="880" y2="120"/>

      <circle class="pulse" cx="985" cy="190" r="12"/>
      <circle class="hub" cx="985" cy="190" r="12"/>
      <circle class="node" cx="880" cy="120" r="8"/>
      <circle class="node" cx="1095" cy="112" r="8"/>
      <circle class="node" cx="1120" cy="232" r="8"/>
      <circle class="node" cx="900" cy="270" r="8"/>
      <circle class="node" cx="1010" cy="292" r="8"/>

      <text class="mono dim" font-size="13" x="866" y="100" text-anchor="end">react</text>
      <text class="mono dim" font-size="13" x="1110" y="96">node</text>
      <text class="mono dim" font-size="13" x="1136" y="237">docker</text>
      <text class="mono dim" font-size="13" x="884" y="275" text-anchor="end">postgres</text>
      <text class="mono dim" font-size="13" x="1026" y="312">ci/cd</text>
    </g>

    <!-- terminal text -->
    <g class="mono" font-size="20">
      <g clip-path="url(#c1)">
        <text x="56" y="116"><tspan class="prompt">$ </tspan><tspan class="cmd">whoami</tspan></text>
      </g>
      <text class="out o1 name" x="56" y="158" font-size="32">Arinchai <tspan class="nick">"Nook"</tspan> Charoenrak</text>
      <text class="out o2 sub" x="56" y="188" font-size="18">Full-stack developer · Rangsit, Thailand</text>

      <g clip-path="url(#c2)">
        <text x="56" y="230"><tspan class="prompt">$ </tspan><tspan class="cmd">cat motto.txt</tspan></text>
      </g>
      <text class="out o3 sub" x="56" y="262" font-size="18">Thoughtful interfaces. Resilient systems.</text>

      <g class="out o4">
        <text x="56" y="304"><tspan class="prompt">$ </tspan></text>
        <rect class="cursor" x="82" y="286" width="11" height="22" fill="#e07ab5"/>
      </g>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
